<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pagoPA in numeri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar a sinistra (come QA WebPortal) + area contenuti a griglia; su telefono la sidebar diventa una barra di schede orizzontale. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --subtle: #f1f3f6;
  --hover: #e9ecf1;
  --border: #e3e6ec;
  --border-strong: #cfd4dc;
  --text: #14171d;
  --text-dim: #545a66;
  --text-muted: #8a909c;
  --accent: #0066cc;
  --accent-soft: #e6f0fb;
  --accent-fg: #ffffff;
  --good: #0b8a3e; --good-soft: #e5f4ea;
  --warn: #b26b00; --warn-soft: #fdf1dc;
  --bad: #c62828;  --bad-soft: #fbe7e7;
  --s1: #257de0; --s2: #f47230; --s3: #00b894; --s4: #f2a600;
  --s-prev: #b4bac4;
  --grid: #eceff3;
  --shadow: 0 1px 0 rgba(15,20,30,.04), 0 2px 8px rgba(15,20,30,.05);
  --radius: 10px;
  --sans: "Geist", ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13; --surface: #15181e; --subtle: #1b1f26; --hover: #222731;
    --border: #252a33; --border-strong: #323844;
    --text: #eceef2; --text-dim: #a2a8b3; --text-muted: #6f7582;
    --accent: #5aa2f0; --accent-soft: #16283f; --accent-fg: #0d0f13;
    --good: #3fbf6a; --good-soft: #13291b; --warn: #e0a440; --warn-soft: #2e2412; --bad: #ef6b6b; --bad-soft: #321718;
    --s1: #338ced; --s2: #e76624; --s3: #00a888; --s4: #d28e05; --s-prev: #4a505c;
    --grid: #20252d; --shadow: 0 1px 0 rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f13; --surface: #15181e; --subtle: #1b1f26; --hover: #222731;
  --border: #252a33; --border-strong: #323844;
  --text: #eceef2; --text-dim: #a2a8b3; --text-muted: #6f7582;
  --accent: #5aa2f0; --accent-soft: #16283f; --accent-fg: #0d0f13;
  --good: #3fbf6a; --good-soft: #13291b; --warn: #e0a440; --warn-soft: #2e2412; --bad: #ef6b6b; --bad-soft: #321718;
  --s1: #338ced; --s2: #e76624; --s3: #00a888; --s4: #d28e05; --s-prev: #4a505c;
  --grid: #20252d; --shadow: 0 1px 0 rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, select { font-family: inherit; font-size: inherit; color: inherit; }
a { color: inherit; }
.num, td.n, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* shell */
.shell { display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: 100vh; }
.side { background: var(--surface); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.brand { display: flex; gap: 10px; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font: 600 12px var(--mono); }
.brand b { display: block; font-weight: 600; letter-spacing: -.01em; }
.brand small { display: block; font: 11px var(--mono); color: var(--text-muted); }
.nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nav-h { font: 500 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); padding: 12px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; text-decoration: none; color: var(--text-dim); }
.nav a:hover { background: var(--hover); color: var(--text); }
.nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.nav a svg { flex: none; }
.nav .tag { margin-left: auto; font: 10px var(--mono); padding: 1px 6px; border-radius: 99px; background: var(--subtle); color: var(--text-muted); }
.side-foot { margin-top: auto; padding: 14px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }
.side-foot b { color: var(--text-dim); font-weight: 500; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top-in { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.crumb { font-size: 13px; color: var(--text-muted); }
.crumb b { color: var(--text); font-weight: 600; }
.filters { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--subtle); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; cursor: pointer; color: var(--text-dim); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 500; }
.sel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
.demo { display: inline-flex; align-items: center; gap: 6px; font: 500 11px var(--mono); color: var(--warn); background: var(--warn-soft); padding: 4px 8px; border-radius: 99px; white-space: nowrap; }

.page { padding-block: 22px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; max-width: 1360px; width: 100%; }
.page-h h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; }
.page-h p { margin: 4px 0 0; color: var(--text-dim); max-width: 72ch; }
.eyebrow { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }

.grid { display: grid; gap: 16px; }
.g-kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-kpi.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1320px) { .g-kpi.six { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 980px) { .g-kpi, .g-kpi.six { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 380px) { .g-kpi, .g-kpi.six { grid-template-columns: minmax(0, 1fr); } }
.g-2 { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.g-2e { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1080px) { .g-2, .g-3 { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 760px) { .g-2e { grid-template-columns: minmax(0,1fr); } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.card-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 14px; font-weight: 600; }
.card-h .sub { color: var(--text-muted); font-size: 12px; }
.card-h .right { margin-left: auto; }
.src { font: 11px var(--mono); color: var(--text-muted); margin-top: 10px; }

.kpi { display: flex; flex-direction: column; gap: 4px; position: relative; }
.kpi .label { color: var(--text-dim); font-size: 12.5px; }
.kpi .val { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .val small { font-size: 14px; font-weight: 500; color: var(--text-dim); margin-left: 3px; }
.kpi .foot { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: 12px; color: var(--text-muted); }
.kpi .foot svg.spark { margin-left: auto; flex: none; }
.kpi .foot { min-height: 28px; }
.delta { font: 500 12px var(--mono); padding: 1px 6px; border-radius: 99px; white-space: nowrap; }
.delta.up { color: var(--good); background: var(--good-soft); }
.delta.down { color: var(--bad); background: var(--bad-soft); }
.delta.flat { color: var(--text-dim); background: var(--subtle); }
.kpi.clickable { cursor: pointer; }
.kpi.clickable:hover { border-color: var(--border-strong); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-dim); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.line { height: 2px; border-radius: 1px; vertical-align: 3px; width: 14px; }

.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--text-muted); font: 11px var(--mono); }

.hbars { display: flex; flex-direction: column; gap: 4px; }
.hbar { display: grid; grid-template-columns: 22px minmax(0, 1.3fr) minmax(0, 1fr) 84px; gap: 10px; align-items: center; padding: 6px 6px; border-radius: 6px; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; }
.hbar:hover { background: var(--hover); }
.hbar .rk { font: 11px var(--mono); color: var(--text-muted); }
.hbar .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .nm small { display: block; color: var(--text-muted); font-size: 11px; }
.hbar .track { height: 8px; background: var(--subtle); border-radius: 4px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }

.stack100 { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; }
.stack100 div { height: 100%; min-width: 2px; }
.stack100 div:first-child { border-radius: 6px 0 0 6px; }
.stack100 div:last-child { border-radius: 0 6px 6px 0; }
.mixrows { display: flex; flex-direction: column; gap: 14px; }
.mixrow .lab { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; color: var(--text-dim); }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 500 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--hover); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.good { color: var(--good); background: var(--good-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.pill.neutral { color: var(--text-dim); background: var(--subtle); }
.pill.accent { color: var(--accent); background: var(--accent-soft); }

.signals { display: flex; flex-direction: column; gap: 10px; }
.signal { display: grid; grid-template-columns: 4px minmax(0,1fr); gap: 12px; padding: 10px 12px 10px 0; border-radius: 8px; background: var(--subtle); text-decoration: none; }
.signal:hover { background: var(--hover); }
.signal .bar { border-radius: 0 3px 3px 0; }
.signal b { font-weight: 600; display: block; }
.signal span { color: var(--text-dim); font-size: 12.5px; }

.heat { display: grid; gap: 3px; }
.heat .hc { padding: 7px 6px; border-radius: 5px; text-align: center; font: 500 12px var(--mono); font-variant-numeric: tabular-nums; cursor: default; }
.heat .hh { font: 500 10.5px var(--mono); color: var(--text-muted); text-align: center; padding: 4px 2px; text-transform: uppercase; letter-spacing: .03em; }
.heat .hn { font-size: 12.5px; padding: 7px 6px 7px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hc.ok { background: var(--good-soft); color: var(--good); }
.hc.near { background: var(--warn-soft); color: var(--warn); }
.hc.ko { background: var(--bad-soft); color: var(--bad); }

.traffic { display: flex; gap: 14px; align-items: center; }
.lamp { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; }

.phase2 { position: relative; }
.phase2 .veil { opacity: .55; filter: saturate(.4); pointer-events: none; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius); border: 1px dashed var(--border-strong); background: var(--surface); }
.banner b { display: block; }
.banner span { color: var(--text-dim); }

.bus td, .bus th { text-align: center; }
.bus td:first-child, .bus th:first-child { text-align: left; white-space: nowrap; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.fact { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--subtle); }
.fact h3 { margin: 0 0 4px; font: 600 13px var(--mono); }
.fact p { margin: 0; color: var(--text-dim); font-size: 12.5px; }
.fact ul { margin: 8px 0 0; padding-left: 16px; font-size: 12.5px; color: var(--text-dim); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.step { border-left: 3px solid var(--border-strong); padding: 4px 0 4px 12px; }
.step.now { border-color: var(--accent); }
.step b { display: block; }
.step span { font-size: 12.5px; color: var(--text-dim); }
.qlist { margin: 0; padding-left: 18px; color: var(--text-dim); display: flex; flex-direction: column; gap: 6px; }
.qlist b { color: var(--text); font-weight: 500; }
.flow { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
.flow .box { flex: 1 1 150px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--subtle); }
.flow .box b { display: block; font-size: 13px; }
.flow .box span { font-size: 12px; color: var(--text-dim); }
.flow .arr { display: grid; place-items: center; color: var(--text-muted); font-size: 18px; }

/* drawer ente */
.scrim { position: fixed; inset: 0; background: rgba(10,14,20,.35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); border-left: 1px solid var(--border); z-index: 21; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: -12px 0 32px rgba(0,0,0,.12); }
.drawer-h { display: flex; align-items: flex-start; gap: 12px; }
.drawer-h h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.drawer-h p { margin: 2px 0 0; color: var(--text-dim); font-size: 13px; }
.xbtn { margin-left: auto; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; flex: none; }
.mini { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.mini .card { padding: 12px 14px; box-shadow: none; }
.mini .val { font-size: 20px; }

.tip { position: fixed; z-index: 40; pointer-events: none; background: var(--text); color: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; max-width: 260px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.tip b { font-weight: 600; }
.tip .row { display: flex; gap: 10px; justify-content: space-between; font-variant-numeric: tabular-nums; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

.foot-note { color: var(--text-muted); font-size: 12px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0,1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); }
  .brand { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .nav { flex-direction: row; overflow-x: auto; padding: 8px max(12px, env(safe-area-inset-left, 0px)); gap: 4px; }
  .nav-h, .side-foot { display: none; }
  .nav a { white-space: nowrap; }
  .nav .tag { display: none; }
  .top-in, .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .filters { margin-left: 0; }
  .hbar { grid-template-columns: 18px minmax(0, 1fr) 70px; }
  .hbar .track { grid-column: 2 / 4; grid-row: 2; }
}
@media (prefers-reduced-motion: no-preference) {
  .page > * { animation: rise .35s ease both; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>
</head>
<body>

<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">pN</div>
      <div><b>pagoPA in numeri</b><small>QA Hub · vista Direzione</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Sezioni">
      <div class="nav-h">Sintesi</div>
      <a href="#panoramica" data-r="panoramica"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>Panoramica</a>
      <div class="nav-h">Entità di piattaforma</div>
      <a href="#transazioni" data-r="transazioni"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5h10l-2-2M14 11H4l2 2"/></svg>Transazioni</a>
      <a href="#posizioni" data-r="posizioni"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M6 6h4M6 9h4"/></svg>Posizioni debitorie</a>
      <a href="#fatturazione" data-r="fatturazione"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2h8v12l-2-1.2L8 14l-2-1.2L4 14z"/><path d="M6 6h4M6 9h3"/></svg>Fatturazione</a>
      <a href="#qualita-psp" data-r="qualita-psp"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2l5 2v4c0 3-2.2 5-5 6-2.8-1-5-3-5-6V4z"/><path d="M6 8l1.5 1.5L10.5 6.5"/></svg>Qualità PSP</a>
      <a href="#rendicontazione" data-r="rendicontazione"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 13h12M4 13V8M8 13V4M12 13V6"/></svg>Rendicontazione<span class="tag">fase 2</span></a>
      <div class="nav-h">Progetto</div>
      <a href="#modello" data-r="modello"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2"/><circle cx="3" cy="3" r="1.3"/><circle cx="13" cy="3" r="1.3"/><circle cx="3" cy="13" r="1.3"/><circle cx="13" cy="13" r="1.3"/><path d="M4 4l2.6 2.6M12 4L9.4 6.6M4 12l2.6-2.6M12 12L9.4 9.4"/></svg>Come funziona</a>
    </nav>
    <div class="side-foot">Aggiornato al <b>24/11/2026</b> (D-1)<br>Fonte: Data Lake pagoPA · aggregati</div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="top-in">
        <div class="crumb">QA Hub / <b id="crumb">Panoramica</b></div>

function yoy(cur, prevArr, ii) { const p = sum(prevArr, ii); return (cur/p - 1) * 100; }
function delta(v, inverse=false, suffix='% a/a', d=1) {
  const good = inverse ? v < 0 : v > 0; const cls = Math.abs(v) < 0.05 ? 'flat' : good ? 'up' : 'down';
  return `<span class="delta ${cls}">${v>0?'+':''}${fmt(v,d)}${suffix}</span>`;
}
function srcLine(t) { return `<div class="src">Fonte: ${t}</div>`; }

/* tooltip */
const tip = $('#tip');
function showTip(html, x, y) { tip.innerHTML = html; tip.hidden = false; const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14; if (left + r.width > innerWidth - 8) left = x - r.width - 14; if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8,left) + 'px'; tip.style.top = Math.max(8,top) + 'px'; }
function hideTip() { tip.hidden = true; }
document.addEventListener('mousemove', e => { const t = e.target.closest('[data-tip]'); if (t && !t.closest('.chart-x')) showTip(t.dataset.tip, e.clientX, e.clientY); else if (!e.target.closest('.chart-x')) hideTip(); });

/* ───────────────────────── grafici SVG ───────────────────────── */
function sparkline(vals, color, w=86, h=28) {
  const mn = Math.min(...vals), mx = Math.max(...vals), r = (mx - mn) || 1;
  const pts = vals.map((v,i) => [i*(w-4)/(vals.length-1)+2, h-3-(v-mn)/r*(h-8)]);
  const d = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${w-2} ${h} L2 ${h}Z" fill="${color}" opacity=".10"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; const st = [1,1.2,1.6,2,2.4,3,4,5,6,8,10]; return st.find(x => x >= n - 1e-9)*p; }

// linee: serie con la stessa unità (es. anno corrente vs precedente)
function lineChart(el, {labels, series, fmtV, h=240, yfmt}) {
  const W = Math.max(el.clientWidth, 280), H = h, L = 52, R = 14, T = 12, B = 26;
  const all = series.flatMap(s => s.values); const mx = niceMax(Math.max(...all)*1.05); const mn = 0;
  const x = i => L + i*(W-L-R)/(labels.length-1); const y = v => T + (1-(v-mn)/(mx-mn))*(H-T-B);
  let g = '';
  for (let k=0;k<=4;k++){ const v = mn + (mx-mn)*k/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${(yfmt||fmtV)(v)}</text>`; }
  const step = W < 520 ? 3 : W < 760 ? 2 : 1;
  labels.forEach((lb,i) => { if (i % step === 0 || i === labels.length-1) g += `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${lb}</text>`; });
  series.forEach(s => {
    const d = s.values.map((v,i) => (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    if (s.area) g += `<path d="${d} L${x(s.values.length-1)} ${y(0)} L${x(0)} ${y(0)}Z" fill="var(${s.c})" opacity=".08"/>`;
    g += `<path d="${d}" fill="none" stroke="var(${s.c})" stroke-width="2" ${s.dash?'stroke-dasharray="4 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = s.values.length-1; if (!s.dash) g += `<circle cx="${x(li)}" cy="${y(s.values[li])}" r="4" fill="var(${s.c})" stroke="var(--surface)" stroke-width="2"/>`;
  });
  g += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--border-strong)" visibility="hidden"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">${g}<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" class="hit"/></svg>`;
  el.classList.add('chart-x');
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh'), hit = svg.querySelector('.hit');
  hit.addEventListener('mousemove', e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(labels.length-1, Math.round((px-L)/((W-L-R)/(labels.length-1)))));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility','visible');
    showTip(`<b>${labels[i]}</b>` + series.map(s => `<div class="row"><span><i style="background:var(${s.c})"></i>${s.name}</span><span>${fmtV(s.values[i])}</span></div>`).join(''), e.clientX, e.clientY); });
  hit.addEventListener('mouseleave', () => { xh.setAttribute('visibility','hidden'); hideTip(); });
}

// barre verticali impilate (stessa unità)
function stackChart(el, {labels, series, fmtV, h=240, hl, yfmt}) {
  const W = Math.max(el.clientWidth, 280), H = h, L = 52, R = 8, T = 12, B = 26;
  const tot = labels.map((_,i) => series.reduce((a,s) => a + s.values[i], 0));
  const mx = niceMax(Math.max(...tot)*1.05); const y = v => T + (1 - v/mx)*(H-T-B);
  const bw = (W-L-R)/labels.length; const w = Math.max(6, bw*0.62);
  let g = '';
  for (let k=0;k<=4;k++){ const v = mx*k/4; g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${(yfmt||(v=>fmt(v,0)))(v)}</text>`; }
  const step = labels.length <= 8 ? 1 : W < 520 ? 3 : W < 760 ? 2 : 1;
  labels.forEach((lb,i) => {
    const cx = L + bw*i + bw/2; let acc = 0;
    series.forEach((s,si) => { const v = s.values[i]; const y0 = y(acc), y1 = y(acc+v); acc += v;
      const top = si === series.length-1; const hgt = Math.max(0, y0 - y1 - (si>0?2:0));
      const yy = y1;
      g += top ? `<path d="M${cx-w/2} ${yy+hgt} V${yy+4} q0 -4 4 -4 H${cx+w/2-4} q4 0 4 4 V${yy+hgt}Z" fill="var(${s.c})" ${hl!=null&&hl!==i?'opacity=".45"':''}/>`
               : `<rect x="${cx-w/2}" y="${yy}" width="${w}" height="${hgt}" fill="var(${s.c})" ${hl!=null&&hl!==i?'opacity=".45"':''}/>`;
    });
    const tipHtml = `<b>${lb}</b>` + series.map(s => `<div class=row><span><i style=background:var(${s.c})></i>${s.name}</span><span>${fmtV(s.values[i])}</span></div>`).join('') + `<div class=row><span>Totale</span><span>${fmtV(tot[i])}</span></div>`;
    g += `<rect x="${L+bw*i}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-tip="${esc(tipHtml)}"/>`;
    if (i % step === 0 || i === labels.length-1) g += `<text x="${cx}" y="${H-6}" text-anchor="middle">${lb}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">${g}</svg>`;
}

function hbars(items, {fmtV, color='--s1', click, sub}) {

      <span class="track"><span class="fill" style="display:block;width:${(d.v/mx*100).toFixed(1)}%;background:var(${color})"></span></span>
      <span class="v">${fmtV(d.v)}</span></button>`).join('') + `</div>`;
}
function stack100(parts) {

/* ───────────────────────── calcoli condivisi ───────────────────────── */
function trxStats() {
  const ii = idx(), f = tf();
  const n = sum(TRX, ii)*f, e = sum(EUR, ii)*f, neg = sum(NEG, ii)*f;
  const succ = Math.min(99, n/(n+neg)*100 + ds());
  return { n, e, neg, succ, tk: e*1000/n * (1 + ds()*0.05),
    yN: yoy(sum(TRX,ii), TRX_PREV, ii), yE: yoy(sum(EUR,ii), EUR_PREV, ii) };
}
function entiF() { return ENTI.filter(e => S.tipo === 'tutti' || e.t === S.tipo); }
function pmul() { return S.period === 'mese' ? 1 : S.period === 'trim' ? 2.96 : 10.1; }
function posStats() {
  const f = tf(); const open = POS_OPEN[12]*f; const ii = idx();
  return { open, due: open*0.198, paid: sum(POS_PAID_M, ii)*f, nw: sum(POS_NEW_M, ii)*f,
           rate: 68.4 + ds()*6, scad30: SCAD.slice(0,4).reduce((a,d)=>a+d.v,0)*f };
}
function qiStats() {
  const rows = PSP.map((p,i) => { const v = QI_VAL[i]; const ok = v.map((x,k) => QI[k].dir>0 ? x >= QI[k].s : x <= QI[k].s); return {...p, v, ok, nOk: ok.filter(Boolean).length}; });
  return { rows, conf: rows.filter(r => r.nOk === QI.length).length };
}
function qiCls(x, k) { const q = QI[k]; const ok = q.dir>0 ? x >= q.s : x <= q.s; if (ok) { const margin = q.dir>0 ? x - q.s : q.s - x; return margin < (q.u==='s'?0.3:0.2) ? 'near' : 'ok'; } return 'ko'; }

PAGES.panoramica = () => {

/* ───────────────────────── drawer ente (drill-across) ───────────────────────── */
function openEnte(id) {
  const e = ENTI.find(x => x.id === id); if (!e) return;
  const trend = SEAS.map((s,i) => e.trx*s*(1+i*0.011)/1000);
  const d = $('#drawer');
  d.innerHTML = `
    <div class="drawer-h"><div><div class="eyebrow">${TIPI[e.t].n} · ${esc(e.r)}</div><h2>${esc(e.n)}</h2><p>Stesso ente letto su tre fatti diversi grazie alla dimensione Ente condivisa.</p></div>
      <button type="button" class="xbtn" id="xclose" aria-label="Chiudi">✕</button></div>
    <div class="mini">
      <div class="card kpi"><span class="label">Transato · ott 2026</span><span class="val">${mld(e.trx*e.tk/1e6)}</span><span class="foot">${mln(e.trx/1000)} di transazioni</span></div>
      <div class="card kpi"><span class="label">Ticket medio</span><span class="val">${fmt(e.tk,0)} €</span><span class="foot">media piattaforma 213 €</span></div>
      <div class="card kpi"><span class="label">Posizioni aperte</span><span class="val">${mln(e.pos/1000)}</span><span class="foot">${mld(e.due/1000)} da incassare</span></div>
      <div class="card kpi"><span class="label">Pagate entro scadenza</span><span class="val">${pct(e.pag)}</span><span class="foot"><span class="pill ${e.pag>=70?'good':e.pag>=55?'warn':'bad'}">${e.pag>=70?'sopra':e.pag>=55?'vicino alla':'sotto la'} media</span></span></div>
    </div>
    <section><div class="card-h"><h2>Transazioni per mese</h2><span class="sub">milioni</span></div><div class="chart" id="c-ente"></div></section>
    <section><div class="card-h"><h2>Posizioni per sistema di gestione</h2></div>
      ${stack100([{k:'GPD',c:'--s1',v:e.gpd*.85},{k:'ACA',c:'--s2',v:e.gpd*.15},{k:'Gestione propria EC',c:'--s4',v:1-e.gpd}])}
      <div style="height:8px"></div>${legend([{k:'GPD',c:'--s1'},{k:'ACA',c:'--s2'},{k:'Gestione propria EC',c:'--s4'}])}</section>
    <div class="banner"><span class="pill accent">Fase 2</span><div><b>Rendicontazione dell’ente</b><span>Qui comparirebbero differenze incassi e flussi in ritardo per questo ente.</span></div></div>
    <p class="foot-note">Dati dimostrativi.</p>`;
  d.hidden = false; $('#scrim').hidden = false;
  lineChart($('#c-ente'), { labels: MONTHS, fmtV: v=>fmt(v,2)+' mln', yfmt: v=>fmt(v,1), h:180, series:[{name:'Transazioni', c:'--s1', area:1, values: trend}] });
  $('#xclose').focus();
}
function closeEnte() { $('#drawer').hidden = true; $('#scrim').hidden = true; }
$('#scrim').addEventListener('click', closeEnte);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEnte(); });
document.addEventListener('click', e => { const b = e.target.closest('[data-ente]'); if (b) openEnte(b.dataset.ente); if (e.target.closest('#xclose')) closeEnte(); });

/* ───────────────────────── router ───────────────────────── */
const TITLES = { panoramica:'Panoramica', transazioni:'Transazioni', posizioni:'Posizioni debitorie', fatturazione:'Fatturazione', 'qualita-psp':'Qualità PSP', rendicontazione:'Rendicontazione', modello:'Come funziona' };
function hashRoute() { try { return (location.hash || '').slice(1); } catch(_) { return ''; } }
function render(r) {
  r = r || hashRoute() || S.route; S.route = PAGES[r] ? r : 'panoramica';
  $('#page').innerHTML = PAGES[S.route]();
  PAGES[S.route].after && PAGES[S.route].after();
  $('#crumb').textContent = TITLES[S.route];
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.r === S.route));
  document.querySelectorAll('#period button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === S.period)));
  $('#tipo').value = S.tipo;
  const filt = !['modello','rendicontazione','qualita-psp'].includes(S.route);
  $('#period').style.visibility = filt ? '' : 'hidden'; $('#tipo').style.visibility = filt ? '' : 'hidden';
  hideTip();
}
// Navigazione interna senza seguire i link: funziona anche dentro visualizzatori che iniettano <base href> (es. Docs del QA Hub).
function go(r) {
  if (!PAGES[r]) return;
  closeEnte(); render(r); window.scrollTo(0,0);
  try { if (hashRoute() !== r) location.hash = r; } catch(_) {}
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  e.preventDefault(); go(a.getAttribute('href').slice(1));
});
window.addEventListener('hashchange', () => { const r = hashRoute(); if (r && r !== S.route && PAGES[r]) { closeEnte(); render(r); window.scrollTo(0,0); } });
$('#period').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.period = b.dataset.p; try { localStorage.setItem('pn-period', S.period); } catch(_) {} render(S.route); });
$('#tipo').addEventListener('change', e => { S.tipo = e.target.value; try { localStorage.setItem('pn-tipo', S.tipo); } catch(_) {} render(S.route); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { PAGES[S.route].after && PAGES[S.route].after(); }, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render(S.route));
render();
</script>
